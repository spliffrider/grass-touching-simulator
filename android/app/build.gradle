plugins {
    id "com.android.application"
}

def signingPropertiesFile = rootProject.file("../.android-signing/signing.properties")
def signingProperties = new Properties()
if (signingPropertiesFile.exists()) {
    signingPropertiesFile.withInputStream { signingProperties.load(it) }
}

android {
    namespace "com.sensitech.grasstouchingsimulator"
    compileSdk 36

    defaultConfig {
        applicationId "com.sensitech.grasstouchingsimulator"
        minSdk 24
        targetSdk 35
        versionCode 1
        versionName "0.1.0-alpha"
    }

    signingConfigs {
        release {
            if (signingPropertiesFile.exists()) {
                storeFile rootProject.file("../.android-signing/grass-touching-alpha.jks")
                storePassword signingProperties["storePassword"]
                keyAlias signingProperties["keyAlias"]
                keyPassword signingProperties["keyPassword"]
            }
        }
    }

    buildTypes {
        debug {
            applicationIdSuffix ".debug"
            versionNameSuffix "-debug"
        }
        release {
            minifyEnabled true
            shrinkResources true
            signingConfig signingConfigs.release
            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro"
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    packaging {
        resources {
            excludes += [
                "META-INF/AL2.0",
                "META-INF/LGPL2.1",
                "META-INF/LICENSE.md",
                "META-INF/LICENSE-notice.md"
            ]
        }
    }
}

dependencies {
    implementation "androidx.webkit:webkit:1.16.0"
}
