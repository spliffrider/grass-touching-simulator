<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta
      name="description"
      content="A cozy incremental clicker about touching grass, collecting seeds, befriending companions, and becoming one with the lawn."
    />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://grasstouchingsimulator.com/" />
    <meta property="og:title" content="Grass Touching Simulator" />
    <meta
      property="og:description"
      content="Touch grass. Relax. Breathe. Collect seeds, unlock companions, and grow an increasingly suspicious lawn."
    />
    <meta property="og:image" content="https://grasstouchingsimulator.com/og-image.png?v=20260611" />
    <meta property="og:image:secure_url" content="https://grasstouchingsimulator.com/og-image.png?v=20260611" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Grass Touching Simulator title screen in a sunny pixel-art meadow." />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Grass Touching Simulator" />
    <meta
      name="twitter:description"
      content="Touch grass. Relax. Breathe. Collect seeds, unlock companions, and grow an increasingly suspicious lawn."
    />
    <meta name="twitter:image" content="https://grasstouchingsimulator.com/og-image.png?v=20260611" />
    <meta name="theme-color" content="#2d6f36" />
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest?v=android-icon-2" />
    <title>Grass Touching Simulator</title>
    <style>
      html,
      body {
        width: 100%;
        height: 100%;
        margin: 0;
        overflow: hidden;
        background: #06190f;
      }

      #loading-shell {
        position: fixed;
        inset: 0;
        z-index: 10;
        display: grid;
        place-items: center;
        padding: max(20px, env(safe-area-inset-top)) max(18px, env(safe-area-inset-right)) max(20px, env(safe-area-inset-bottom))
          max(18px, env(safe-area-inset-left));
        box-sizing: border-box;
        color: #f7ffe8;
        font-family: "Trebuchet MS", Arial, sans-serif;
        text-align: center;
        background:
          radial-gradient(circle at 50% 35%, rgba(78, 140, 64, 0.34), transparent 42%),
          linear-gradient(180deg, #0a2314 0%, #06190f 62%, #031008 100%);
        transition: opacity 180ms ease;
      }

      html.grass-app-ready #loading-shell {
        opacity: 0;
        pointer-events: none;
      }

      .loading-shell__title {
        font-size: clamp(28px, 9vw, 52px);
        font-weight: 800;
        line-height: 0.95;
        text-shadow:
          0 3px 0 #17351f,
          0 0 18px rgba(183, 235, 165, 0.34);
      }

      .loading-shell__subtitle {
        margin-top: 14px;
        font-size: clamp(14px, 4vw, 18px);
        color: #dfffc8;
      }

      .loading-shell__bar {
        width: min(280px, 72vw);
        height: 8px;
        margin: 22px auto 0;
        overflow: hidden;
        border: 2px solid rgba(224, 163, 108, 0.78);
        background: rgba(6, 25, 15, 0.82);
      }

      .loading-shell__bar span {
        display: block;
        width: 46%;
        height: 100%;
        background: linear-gradient(90deg, #b7eba5, #f3c16f);
        animation: grass-loading-slide 1.1s ease-in-out infinite;
      }

      @keyframes grass-loading-slide {
        0% {
          transform: translateX(-110%);
        }

        100% {
          transform: translateX(230%);
        }
      }
    </style>
  </head>
  <body>
    <div id="loading-shell" aria-live="polite">
      <div class="loading-shell__inner">
        <div class="loading-shell__title">Grass Touching Simulator</div>
        <div class="loading-shell__subtitle">Growing your field...</div>
        <div class="loading-shell__bar"><span></span></div>
      </div>
    </div>
    <div id="game"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
